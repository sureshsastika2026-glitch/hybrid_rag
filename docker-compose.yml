services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: hybrid_rag_qdrant
    ports:
      - "6335:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.20-community
    container_name: hybrid_rag_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  streamlit_app:
    build: .
    container_name: hybrid_rag_frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - qdrant
      - neo4j

volumes:
  qdrant_data:
  neo4j_data: